<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found on manueloswald.com.">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://manueloswald.com/404.html">
    <title>404 — Manuel Oswald</title>
    <style>
      :root{--color-red:#ff2d08;--color-dark:#191918;--color-light:#f2f2f1;--color-ink:#080808;--color-white:#f8f8f6;--font-sans:"Helvetica Neue",Helvetica,Arial,sans-serif;--weight-regular:400;--weight-bold:700;--tracking-label:.28em;--leading-display:.99;--leading-copy:1.45;--space-page:clamp(2rem,4.45vw,4.3rem);--border:1px solid #c4c4c1}
      *{box-sizing:border-box}
      html{background:var(--color-dark);color:var(--color-ink);font-family:var(--font-sans)}
      body{margin:0;min-width:320px}
      a{color:inherit}
      .error-grid{display:grid;grid-template-columns:minmax(0,50fr) minmax(27rem,35fr);min-height:100vh;overflow-x:clip}
      .error-hero{display:flex;min-height:74vh;flex-direction:column;padding:clamp(2.75rem,6.3vh,6.4rem) clamp(1.5rem,2.2vw,2.2rem) clamp(3.5rem,6.9vh,7rem) var(--space-page);background:var(--color-red)}
      .eyebrow{margin:0;font-size:clamp(.78rem,1.25vw,1.18rem);font-weight:var(--weight-regular);letter-spacing:var(--tracking-label);line-height:1.2;text-transform:uppercase}
      h1{margin:clamp(1.1rem,1.25vw,1.25rem) 0 0;font-size:clamp(3.1rem,4.2vw,4.15rem);font-weight:var(--weight-bold);letter-spacing:-.052em;line-height:var(--leading-display)}
      .error-copy{max-width:39rem;margin:auto 0 0;font-size:clamp(1.15rem,1.72vw,1.65rem);line-height:1.43}
      .error-return{display:flex;min-height:100%;align-items:flex-end;padding:clamp(3.5rem,5.3vh,5.25rem) var(--space-page) clamp(3.5rem,6vh,5.75rem);background:var(--color-dark);color:var(--color-white)}
      .error-return a{font-size:1.05rem;text-decoration:none;text-transform:uppercase}
      a:focus-visible{outline:3px solid currentColor;outline-offset:-6px}
      @media (max-width:680px){:root{--space-page:clamp(1.35rem,6.5vw,2.25rem)}.error-grid{display:flex;min-height:100vh;flex-direction:column}.error-hero{min-height:38rem;max-height:none;padding-block:2.8rem 3rem}h1{margin-top:1.4rem;font-size:clamp(2.25rem,10.4vw,3.65rem);letter-spacing:-.055em}.error-copy{font-size:1.12rem}.eyebrow{font-size:.76rem}.error-return{min-height:0;padding:3.5rem var(--space-page) 4rem}}
    </style>
  </head>
  <body>
    <main class="error-grid">
      <section class="error-hero" aria-labelledby="error-title">
        <p class="eyebrow">Page Not Found</p>
        <h1 id="error-title">404</h1>
        <p class="error-copy">Page not found.</p>
      </section>
      <nav class="error-return" aria-label="Error page navigation">
        <a href="/">Return home →</a>
      </nav>
    </main>
  </body>
</html>
