name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ github.event_name == 'push' && secrets.CLOUDFLARE_WEB_ANALYTICS_TOKEN || '' }}
        run: pnpm build

      - name: Validate static SEO outputs
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ github.event_name == 'push' && secrets.CLOUDFLARE_WEB_ANALYTICS_TOKEN || '' }}
        run: |
          pnpm run validate:indexing
          pnpm run validate:jsonld
          pnpm run validate:links
          if [ -n "$CLOUDFLARE_WEB_ANALYTICS_TOKEN" ]; then
            pnpm run validate:analytics -- present
          else
            pnpm run validate:analytics -- absent
          fi

      - name: Run Lighthouse and accessibility checks
        run: pnpm run quality

      - name: Setup Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
